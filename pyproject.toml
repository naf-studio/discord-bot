[project]
name = "discord-bot"
version = "0.2.0"
description = "Community automation Discord bot powered by discord.py and modern Python tooling."
authors = [{ name = "naipret", email = "ngvphu235e@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.4.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
discord-bot = "discord_bot.main:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "ty>=0.0.84",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["discord_bot"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
]
ignore = [
    "E501",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
