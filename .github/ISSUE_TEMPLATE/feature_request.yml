name: "Feature Request"
description: "Suggest a new slash command, event listener, or improvement for the bot"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest an idea to improve the community experience across NAF Studio.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What challenge, inconvenience, or missing capability does this address?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the proposed feature, parameters, permissions, or user flow.
    validations:
      required: true
